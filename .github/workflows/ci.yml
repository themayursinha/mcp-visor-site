name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.0.0
        with:
          node-version: "22.23.2"
          cache: "npm"
      # Pinned npm 11 implements min-release-age from .npmrc; the bundled
      # npm 10 would silently ignore the quarantine.
      - run: npm install -g npm@11.19.1
      - run: npm ci
      - run: npm run build
